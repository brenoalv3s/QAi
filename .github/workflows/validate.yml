name: Validar plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validação estática
        run: node tools/validate-plugin.mjs
      - name: Smoke test
        run: node tools/smoke-test.mjs
